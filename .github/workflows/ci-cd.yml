name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://fixdesk:fixdesk@localhost:5432/fixdesk
  JWT_SECRET: ci-only-secret-at-least-32-characters-long

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Preveri backend in frontend
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixdesk
          POSTGRES_PASSWORD: fixdesk
          POSTGRES_DB: fixdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixdesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Zgradi backend in frontend
        run: |
          npm run build --prefix backend
          npm run build --prefix frontend
        env:
          VITE_API_URL: ''
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: backend/dist/
          if-no-files-found: error
      - name: Package prebuilt application image
        run: |
          docker build -t fixdesk:${{ github.sha }} .
          container=$(docker run -d --rm --network host -e DATABASE_URL -e JWT_SECRET "fixdesk:$GITHUB_SHA")
          trap 'docker logs "$container"; docker stop "$container" || true' EXIT
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/api/db-health
          curl --fail http://localhost:8080/
          docker save fixdesk:${{ github.sha }} | gzip > fixdesk-image.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: deploy-image
          path: fixdesk-image.tar.gz
          if-no-files-found: error
          compression-level: 0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Testiraj backend in frontend
        run: |
          npm run test:coverage --prefix backend
          npm run test:coverage --prefix frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://projekt-rirs-fork-bootstrap.onrender.com/
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: deploy-image
      - name: Publish and deploy the built image
        run: |
          test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load -i fixdesk-image.tar.gz
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "fixdesk:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          echo "RENDER_IMAGE=$image:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Deploy image and wait for Render
        run: node .github/scripts/render-deploy.mjs
