primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "./node_modules/.bin/prisma migrate deploy --config prisma7.config.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpus = 1
